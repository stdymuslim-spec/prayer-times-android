name: Build APK

# Builds an installable APK. Push a tag such as v1.0.0 (or run it by hand) and the
# APK is attached to a GitHub release. If the four KEYSTORE_* / KEY_* secrets exist
# the APK is signed with your own release key; without them it is signed with the
# well-known debug key, which is fine for trying it out but not for sharing.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already ships the Android SDK, so install no extra packages.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
            cp "$RUNNER_TEMP/signed.apk" "$APK"
            "$BT/apksigner" verify --print-certs "$APK" | head -3
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No release key configured. The APK is signed with the debug key."
          fi

      - name: Name the file
        id: apk
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${GITHUB_SHA::7}"; fi
          DEST="prayer-times-sg-$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: prayer-times-sg-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A tagged build also becomes a downloadable release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
